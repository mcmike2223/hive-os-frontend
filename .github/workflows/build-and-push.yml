name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/mcmike2223/hive-os-frontend:latest
            ghcr.io/mcmike2223/hive-os-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CENTRAL_DOMAINS=${{ vars.NEXT_PUBLIC_CENTRAL_DOMAINS }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'gulfingot.com' }}
            NEXT_PUBLIC_SERVER_IP=${{ vars.NEXT_PUBLIC_SERVER_IP }}
            NEXT_PUBLIC_FRONTEND_DOMAIN=${{ vars.NEXT_PUBLIC_FRONTEND_DOMAIN || 'hive.gulfingot.com' }}
            NEXT_PUBLIC_BACKEND_DOMAIN=${{ vars.NEXT_PUBLIC_BACKEND_DOMAIN || 'hive-backend.gulfingot.com' }}
            NEXT_PUBLIC_REVERB_DOMAIN=${{ vars.NEXT_PUBLIC_REVERB_DOMAIN || 'hive-ws.gulfingot.com' }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ secrets.NEXT_PUBLIC_REVERB_APP_KEY }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST || 'hive-ws.gulfingot.com' }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT || '443' }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME || 'https' }}
            INTERNAL_API_URL=${{ vars.INTERNAL_API_URL || 'http://backend:8000/api/v1' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_SKIP_BUILD_TYPECHECK=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Deploy and verify in Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_BASE_URL: ${{ vars.COOLIFY_API_BASE_URL || 'https://deploy.techiveet.com/api/v1' }}
        run: |
          test -n "$COOLIFY_API_TOKEN"
          auth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$COOLIFY_API_BASE_URL/teams" \
            -H "Accept: application/json" -H "Authorization: Bearer $COOLIFY_API_TOKEN" || true)"
          case "$auth_status" in
            200) ;;
            401)
              echo "::error::Coolify rejected COOLIFY_API_TOKEN. Replace the production environment secret with a current token for the deployment team."
              exit 1
              ;;
            403)
              echo "::error::COOLIFY_API_TOKEN is valid but lacks access to the deployment team."
              exit 1
              ;;
            *)
              echo "::error::Coolify authentication preflight returned HTTP $auth_status. Check COOLIFY_API_BASE_URL and API access."
              exit 1
              ;;
          esac

          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$COOLIFY_API_BASE_URL/deploy?uuid=z140ve7ehjoyuoluqk0azmwe&force=false" \
            -H "Accept: application/json" -H "Authorization: Bearer $COOLIFY_API_TOKEN")"
          deployment_uuid="$(jq -er '.deployments[0].deployment_uuid' <<<"$response")"
          echo "Coolify deployment queued: $deployment_uuid"
          for attempt in $(seq 1 100); do
            status="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              "$COOLIFY_API_BASE_URL/deployments/$deployment_uuid" \
              -H "Accept: application/json" -H "Authorization: Bearer $COOLIFY_API_TOKEN" |
              jq -er '.status')"
            echo "Coolify status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Coolify deployment."
          exit 1
